# Builds the TSA Bot Windows desktop app (TSABot.exe) on a real Windows machine, runs the bot's tests there and
# a self test of the finished .exe, and offers the result as a downloadable artifact ("TSABot-windows").
name: TSA Bot Windows

on:
  push:
    branches: [claude/awesome-mccarthy-r3cum5]
    paths:
      - "TradingviewSignalAgent/bot/**"
      - "TradingviewSignalAgent/src/tsa/features/**"
      - "TradingviewSignalAgent/src/tsa/indicators/**"
      - ".github/workflows/tsabot-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: TradingviewSignalAgent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt -r bot/requirements-desktop.txt pyinstaller

      - name: Tests on Windows (DPAPI, registry, locks, API, engine)
        working-directory: TradingviewSignalAgent/bot
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider tests --ignore=tests/test_ui.py

      - name: Build TSABot.exe
        run: |
          python bot/packaging/make_icon.py
          pyinstaller --noconfirm --clean bot/packaging/tsabot.spec --distpath dist --workpath build

      - name: Self test of the finished exe
        run: |
          $d = Join-Path $env:RUNNER_TEMP "tsa-selftest"
          $p = Start-Process -FilePath "dist\TSABot\TSABot.exe" -ArgumentList "--selftest", "--data-dir", "`"$d`"" -Wait -PassThru
          Get-Content (Join-Path $d "selftest.json")
          if ($p.ExitCode -ne 0) { throw "self test failed ($($p.ExitCode))" }

      - name: Readme for the download
        run: |
          @"
          TSA Bot - Windows

          1. Bu klasoru kalici bir yere kopyala (or. C:\TSABot). Masaustu / Belgeler de olur.
          2. TSABot.exe'ye cift tikla. Windows "bilinmeyen yayinci" uyarisi verirse: Ek bilgi -> Yine de calistir.
          3. Ilk acilista uygulama sifreni belirle. Ayarlar, sifreli API anahtarlari ve islem gecmisi
             %LOCALAPPDATA%\TSABot klasorunde durur; programi guncellemek icin sadece bu klasoru degistirmen yeter.
          4. Pencereyi X ile kapatinca bot calismaya devam eder (saatin yanindaki ^ gizli simgeler).
             Tamamen kapatmak icin oradaki simgeye sag tikla -> Tamamen kapat.
          "@ | Set-Content -Encoding utf8 dist\TSABot\BENIOKU.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TSABot-windows
          path: TradingviewSignalAgent/dist/TSABot
          retention-days: 90
